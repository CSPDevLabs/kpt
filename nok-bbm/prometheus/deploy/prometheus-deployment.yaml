apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbm-prometheus-deployment
  namespace: nok-bbm
  labels:
    app: bbm-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bbm-prometheus
  template:
    metadata:
      labels:
        app: bbm-prometheus
    spec:
      serviceAccountName: bbm-prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0 # kpt-set: prom/prometheus:${prometheus-version} 
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/etc/prometheus/console_libraries
        - --web.console.templates=/etc/prometheus/consoles
        # - --web.external-url=http://test.nok.local:8080/prometheus # kpt-set: --web.external-url=http://${ingress-host}:8080/prometheus
        # - --web.route-prefix=/prometheus     
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: bbm-prometheus-config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: ds-file-configs
          mountPath: /opt/targets/
        - name: bbm-prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: bbm-prometheus-config-volume
        configMap:
          name: bbm-prometheus-config
      - name: ds-file-configs
        projected:
          sources:
          - configMap:
              name: nokia-srsim-sros-bngt
          - configMap:
              name: linux-sros-bngt
      - name: bbm-prometheus-storage
        emptyDir: {} # For local testing, use emptyDir. For production, use PersistentVolumeClaim.
