apiVersion: v1
kind: Service
metadata:
  labels:
    app: bbm-prometheus
  name: bbm-prometheus-lbl
  namespace: nok-bbm
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  loadBalancerIP: 172.18.0.112
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9090
  selector:
    app: bbm-prometheus
  sessionAffinity: None
  type: LoadBalancer
