apiVersion: v1
kind: ConfigMap
metadata:
  name: bbm-prometheus-config
  namespace: nok-bbm
  labels:
    app: bbm-prometheus
data:
  prometheus.yml: |-
    global:
      scrape_interval: 30s
      scrape_timeout: 7s
      evaluation_interval: 10s
    rule_files:
    - /etc/prometheus/rules/*
    scrape_configs:
    - job_name: blackbox
      honor_timestamps: true
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /metrics
      scheme: http
      follow_redirects: true
      enable_http2: true
      static_configs:
      - targets:
        - blackbox-svc:9115
    - job_name: ds_file_nokia_srsim_ssh_check
      honor_timestamps: true
      params:
        module:
        - ssh_check
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__address__]
        separator: ;
        regex: (.+)
        target_label: __param_target
        replacement: $1:22
        action: replace
      - source_labels: [hostname]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      file_sd_configs:
      - files:
        - /opt/targets/nokia_srsim*.json
        refresh_interval: 10s
    - job_name: ds_file_nokia_srsim_gnmi_check
      honor_timestamps: true
      params:
        module:
        - tcp_connect
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__address__]
        separator: ;
        regex: (.+)
        target_label: __param_target
        replacement: $1:57400
        action: replace
      - source_labels: [hostname]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      file_sd_configs:
      - files:
        - /opt/targets/nokia_srsim*.json
        refresh_interval: 10s
    - job_name: kube_state_metrics
      honor_timestamps: true
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /metrics
      scheme: http
      follow_redirects: true
      enable_http2: true
      static_configs:
      - targets:
        - kube-state-metrics:8080
        - kube-state-metrics:8081
    - job_name: ds_file_linux_icmp_ping
      honor_timestamps: true
      params:
        module:
        - icmp_ping
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__address__]
        separator: ;
        regex: (.*)
        target_label: __param_target
        replacement: $1
        action: replace
      - source_labels: [hostname]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      file_sd_configs:
      - files:
        - /opt/targets/linux*.json
        refresh_interval: 10s
    - job_name: nok_services_http
      honor_timestamps: true
      params:
        module:
        - http_2xx
      scrape_interval: 1m
      scrape_timeout: 5s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_bbm]
        separator: ;
        regex: "true"
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_prober]
        separator: ;
        regex: http
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_service_port_protocol]
        separator: ;
        regex: TCP
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        separator: ;
        regex: (.*)
        target_label: namespace
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_service_name]
        separator: ;
        regex: (.*)
        target_label: service
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __tmp_scheme
        replacement: http
        action: replace
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_scheme]
        separator: ;
        regex: (https?)
        target_label: __tmp_scheme
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __tmp_path
        replacement: /
        action: replace
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_path]
        separator: ;
        regex: (.+)
        target_label: __tmp_path
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace, __meta_kubernetes_service_port_number,
          __tmp_path, __tmp_scheme]
        separator: ;
        regex: (.+);(.+);(.+);(.+);(.+)
        target_label: __param_target
        replacement: $5://$1.$2.svc.cluster.local:$3$4
        action: replace
      - source_labels: [__param_target]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      kubernetes_sd_configs:
      - role: service
        kubeconfig_file: ""
        follow_redirects: true
        enable_http2: true
    - job_name: nok_services_tcp
      honor_timestamps: true
      params:
        module:
        - tcp_connect
      scrape_interval: 1m
      scrape_timeout: 5s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_bbm]
        separator: ;
        regex: "true"
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_netopskube_io_prober]
        separator: ;
        regex: tcp
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_service_port_protocol]
        separator: ;
        regex: TCP
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        separator: ;
        regex: (.*)
        target_label: namespace
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_service_name]
        separator: ;
        regex: (.*)
        target_label: service
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace, __meta_kubernetes_service_port_number]
        separator: ;
        regex: (.+);(.+);(.+)
        target_label: __param_target
        replacement: $1.$2.svc.cluster.local:$3
        action: replace
      - source_labels: [__param_target]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      kubernetes_sd_configs:
      - role: service
        kubeconfig_file: ""
        follow_redirects: true
        enable_http2: true
    - job_name: nok_ingress
      honor_timestamps: true
      params:
        module:
        - http_2xx
      scrape_interval: 30s
      scrape_timeout: 7s
      metrics_path: /probe
      scheme: http
      follow_redirects: true
      enable_http2: true
      relabel_configs:
      - source_labels: [__meta_kubernetes_ingress_annotation_netopskube_io_bbm]
        separator: ;
        regex: "true"
        replacement: $1
        action: keep
      - source_labels: [__meta_kubernetes_ingress_scheme, __meta_kubernetes_ingress_host,
          __meta_kubernetes_ingress_path]
        separator: ;
        regex: (.+);(.+);(.+)
        target_label: __param_target
        replacement: ${1}://${2}
        action: replace
      - source_labels: [__param_target]
        separator: ;
        regex: (.*)
        target_label: instance
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_namespace]
        separator: ;
        regex: (.*)
        target_label: namespace
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_ingress_name]
        separator: ;
        regex: (.*)
        target_label: ingress
        replacement: $1
        action: replace
      - separator: ;
        regex: (.*)
        target_label: __address__
        replacement: blackbox-svc:9115
        action: replace
      kubernetes_sd_configs:
      - role: ingress
        kubeconfig_file: ""
        follow_redirects: true
        enable_http2: true