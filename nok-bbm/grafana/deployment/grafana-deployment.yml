apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bbm-grafana
  name: bbm-grafana
  namespace: nok-bbm
spec:
  selector:
    matchLabels:
      app: bbm-grafana
  template:
    metadata:
      labels:
        app: bbm-grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      # Add an initContainer to download dashboards - TOBE IMPLEMENTED
      initContainers:
        - name: download-dashboards
          image: alpine/git:latest # A lightweight image with git
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /dashboards-volume;
              git clone --filter=blob:none --sparse --branch main https://github.com/CSPDevLabs/kpt.git;
              cd kpt;
              git sparse-checkout set nok-bbm/grafana/dashboards;
              cp nok-bbm/grafana/dashboards/*.json /dashboards-volume/;
              rm -rf kpt; # Clean up the cloned repository
          volumeMounts:
            - name: grafana-dashboards-download # Mount the emptyDir volume
              mountPath: /dashboards-volume
      containers:
        - name: bbm-grafana
          image: grafana/grafana:12.3.2 # kpt-set: grafana/grafana:${grafana-version}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_SERVER_ROOT_URL
              value: http://bng.nok.local/bbm
            - name: GF_INSTALL_PLUGINS
              value: 'andrewbmchugh-flow-panel'
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: 250m
              memory: 750Mi
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources-volume
              readOnly: true
            - mountPath: /var/lib/grafana/dashboards # Mount the downloaded dashboards here
              name: grafana-dashboards-download
            - mountPath: /etc/grafana/provisioning/dashboards
              name: grafana-dashboard-provisioning-volume
      volumes:
        - name: grafana-pv
          persistentVolumeClaim:
            claimName: bbm-grafana-pvc
        - name: grafana-datasources-volume
          configMap:
            name: bbm-grafana-datasources-config
        - name: grafana-dashboard-provisioning-volume
          configMap:
            name: bbm-grafana-dashboard-provisioning
        - name: grafana-dashboards-download
          emptyDir: {}
