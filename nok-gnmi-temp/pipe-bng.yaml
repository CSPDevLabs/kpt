apiVersion: v1
kind: Secret
metadata:
  name: device-credentials
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: NokiaSros1!
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: TargetProfile
metadata:
  name: default-profile
spec:
  # Reference to a Secret containing username/password
  credentialsRef: device-credentials
  # TLS without server certificate verification
  #tls: {}
  # Connection timeout
  timeout: 10s
---  
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: clab-sros-bngt-bng1
  labels:
    vendor: vendorA
    role: core
spec:
  address: 172.21.20.11:57400
  profile: default-profile
---  
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: interface-counters
  labels:
    type: interfaces
spec:
  paths:
    - /state/system/cpu[sample-period=60]/summary/usage
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 10s
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: prometheus-output
  labels:
    type: metrics
spec:
  # type: prometheus
  type: file
  config:
    file-type: stdout  # or file path
    format: event  
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  name: core-telemetry
spec:
  clusterRef: core-cluster
  enabled: true
  # Select targets by label
  targetSelectors:
    - matchLabels:
        vendor: vendorA
        role: core
  # Select subscriptions by label
  subscriptionSelectors:
    - matchLabels:
        type: interfaces
  # Select outputs by label
  outputs:
    outputSelectors:
      - matchLabels:
          type: metrics  