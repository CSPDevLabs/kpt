apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: nok-bng
  labels:
    app: promtail
data:
  promtail.yml: |
    clients:
      - url: http://tel-loki:3100/loki/api/v1/push

    scrape_configs:
    - job_name: syslog
      pipeline_stages:
      - regex:
          expression: '^(?P<seq>\d+)\s(?P<timestamp>\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s(?P<tz>\w+)\s(?P<severity>\w+):\s(?P<application>\w+)\s#(?P<event_id>\d+)\s(?P<vrtr_name>\w+)\s(?P<message>.*)$'
      - labels:
          seq:
          timestamp:
          tz:
          severity:
          application:
          event_id:
          vrtr_name:
      - output:
          source: message
      syslog:
        listen_address: 0.0.0.0:1514
        listen_protocol: tcp
        idle_timeout: 300s
        syslog_format: rfc5424
        label_structured_data: yes
        labels:
          job: "syslog"
      relabel_configs:
        - source_labels: ['__syslog_message_hostname']
          target_label: 'source'
        - source_labels: ['__syslog_message_severity']
          target_label: 'level'
        - source_labels: ['__syslog_message_app_name']
          target_label: 'application'
        - source_labels: ['__syslog_message_facility']
          target_label: 'facility'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: nok-bng
  labels:
    app: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
      - name: promtail
        image: grafana/promtail:3.4.3
        args:
        - -config.file=/etc/promtail/config.yml
        ports:
        - containerPort: 1514 # Syslog listener port
          name: syslog-tcp
        volumeMounts:
        - name: promtail-config-volume
          mountPath: /etc/promtail/config.yml
          subPath: promtail.yml
        - name: localtime-volume
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: promtail-config-volume
        configMap:
          name: promtail-config
      - name: localtime-volume
        hostPath: # Using hostPath as requested for /etc/localtime
          path: /etc/localtime
          type: FileOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tel-pt
  namespace: nok-bng
  labels:
    app: promtail
spec:
  selector:
    app: promtail
  ports:
  - protocol: TCP
    port: 1514
    targetPort: syslog-tcp
    name: syslog-tcp
  type: ClusterIP
