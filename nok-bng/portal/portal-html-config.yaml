apiVersion: v1
kind: ConfigMap
metadata:
  name: nok-apps-portal-nginx-config
  namespace: nok-bng
data:
  nok-portal.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /menu-config.json {
            default_type application/json;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            log_not_found off;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nok-apps-portal-html-config
  namespace: nok-bng
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>NetOpsKube Portal</title>

    <style>
    :root {
      --primary: #0a192f;
      --secondary: #112240;
      --accent: #1e90ff;
      --light: #4da3ff;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      overflow: hidden;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
      height: 50px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .hamburger {
      font-size: 22px;
      cursor: pointer;
      margin-right: 15px;
      user-select: none;
    }

    .portal-title {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--light);
    }

    .version {
      font-size: 14px;
      color: var(--light);
    }

    /* ---------- MAIN LAYOUT ---------- */
    .main-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 0;
      background: rgba(10,25,47,0.98);
      border-right: 1px solid var(--border);
      transition: width 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    .sidebar.open {
      width: 250px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    /* ---------- CONTENT ---------- */
    .content {
      flex: 1;
      position: relative;
      display: flex;
      transition: all 0.3s ease;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }

    /* ---------- LOADING OVERLAY ---------- */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 1;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      width: 55px;
      height: 55px;
      border: 5px solid rgba(255,255,255,0.15);
      border-top: 5px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    </style>
    </head>

    <body>

    <div class="topbar">
      <div class="hamburger" id="hamburger">&#9776;</div>
      <div class="portal-title">NetOpsKube Portal</div>
      <div style="margin-left:auto;">
        <span class="version">v1.0</span>
      </div>
    </div>

    <div class="main-layout">
      <div class="sidebar" id="sidebar"></div>

      <div class="content">
        <div id="loading-overlay">
          <div class="loader"></div>
        </div>
        <iframe id="app-frame"></iframe>
      </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

      const sidebar = document.getElementById('sidebar');
      const hamburger = document.getElementById('hamburger');
      const appFrame = document.getElementById('app-frame');
      const loadingOverlay = document.getElementById('loading-overlay');

      document.addEventListener('click', (e) => {
        const isSidebarClick = sidebar.contains(e.target) || hamburger.contains(e.target);

        if (!isSidebarClick) {
          sidebar.classList.remove('open');
        }
      });

      hamburger.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });

      const iconMap = {
        "Prometheus": "data:image/svg+xml;base64,",
        "Grafana": "data:image/svg+xml;base64,",
        "Alertmanager": "data:image/svg+xml;base64,",
        "Gitea": "data:image/png;base64,",
        "BBM (Self Monitoring)": "data:image/png;base64,"
      };

      fetch('/menu-config.json')
        .then(resp => resp.ok ? resp.json() : Promise.reject(resp.status))
        .then(menuItems => {

          menuItems.forEach((item, index) => {

            const menuItem = document.createElement('div');
            menuItem.className = 'menu-item';
            menuItem.dataset.path = item.path;
            menuItem.dataset.openInNewTab = item.openInNewTab || false;

            const icon = document.createElement('img');
            icon.className = 'menu-icon';
            icon.src = iconMap[item.name] || '';
            icon.alt = item.name;

            const text = document.createElement('span');
            text.textContent = item.name;

            menuItem.appendChild(icon);
            menuItem.appendChild(text);

            menuItem.addEventListener('click', () => {
              if (menuItem.dataset.openInNewTab === 'true') {
                window.open(menuItem.dataset.path, '_blank');
              } else {
                loadingOverlay.classList.remove('hidden');
                appFrame.src = menuItem.dataset.path;
              }

              sidebar.classList.remove('open');
            });

            sidebar.appendChild(menuItem);

          });

          appFrame.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
          });

        })
        .catch(err => {
          sidebar.innerHTML = `<p style="color:red;padding:20px;">Failed to load apps: ${err}</p>`;
        });

    });
    </script>

    </body>
    </html>
