---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: nok-bng
  labels:
    dashboards: "grafana"
spec:
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      # storageClassName: "" # Customize storage class if needed
  config:
    log:
      mode: "console"  
    auth.anonymous:
      enabled: "true"
      org_role: "Admin"

    server:
      root_url: "http://bng.nok.local:8080/grafana"

  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              readinessProbe:
                failureThreshold: 3
              env:
                - name: GF_INSTALL_PLUGINS
                  value: "andrewbmchugh-flow-panel"                  
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
      strategy:
        type: Recreate
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-datasource
  namespace: nok-bng
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana" # Matches the label on your Grafana object
  datasource:
    name: Prometheus
    type: prometheus
    uid: DS_PROMETHEUS
    access: proxy
    url: http://prometheus-operated:9090
    jsonData:
      httpMethod: POST
      timeout: 60
      manageAlerts: false
      prometheusType: Prometheus
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-datasource
  namespace: nok-bng
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Loki
    type: loki
    uid: DS_LOKI
    access: proxy
    url: http://tel-loki:3100
    jsonData:
      timeout: 60
      maxLines: 1000
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: bng-core-aggregation
  namespace: nok-bng
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://raw.githubusercontent.com/CSPDevLabs/nok-clabs/refs/heads/main/nok-bng/grafana-dashboards/bng-core-aggregation.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: subscriber-insight
  namespace: nok-bng
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://raw.githubusercontent.com/CSPDevLabs/nok-clabs/refs/heads/main/nok-bng/grafana-dashboards/subscriber-insight.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: bng-state-and-availability
  namespace: nok-bng
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://raw.githubusercontent.com/CSPDevLabs/nok-clabs/refs/heads/main/nok-bng/grafana-dashboards/bng-state-and-availability.json"
