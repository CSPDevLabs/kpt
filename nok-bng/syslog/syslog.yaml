apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-ng-config
  namespace: nok-bng
  labels:
    app: syslog-ng
data:
  syslog-ng.conf: |
    @version: 4.2
    @include "scl.conf"

    options {
        chain-hostnames(no);
        flush-lines(0);
        use-dns(no);
        use-fqdn(no);
        perm(0644);
        stats(freq(0));
        mark_freq(0); 
        log_msg_size(8192);
        keep-hostname(yes);
    };

    # Receive RFC3164 messages from SROS on UDP port 1514
    source s_rfc3164_udp_sros {
        udp(
            ip(0.0.0.0)
            port(1514)
        );
    };

    # Promtail RFC5424
    destination d_rfc5424 {
      network(
      "tel-pt"
      port(1514)
      transport("tcp")
      flags(syslog-protocol)
      ); # Added closing parenthesis for network block
    };

    destination d_file {
      file("/var/log/validate.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
      ); # Added closing parenthesis for file block
    };

    log {
      source(s_rfc3164_udp_sros);
      destination(d_rfc5424);
    };

    # For debug / test purposes
    log {
        source(s_rfc3164_udp_sros);
        destination(d_file);
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-ng
  namespace: nok-bng
  labels:
    app: syslog-ng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syslog-ng
  template:
    metadata:
      labels:
        app: syslog-ng
    spec:
      initContainers:
      - name: copy-syslog-ng-config
        image: busybox:1.36.1
        command:
          - sh
          - -c
          - |
            cp /tmp/config-source/syslog-ng.conf /config/syslog-ng.conf
            echo "--- syslog-ng.conf content ---"
            cat /config/syslog-ng.conf
            echo "-----------------------------"
        volumeMounts:
        - name: syslog-ng-config-source
          mountPath: /tmp/config-source
        - name: syslog-ng-writable-config
          mountPath: /config
      containers:
      - name: syslog-ng
        image: linuxserver/syslog-ng:4.8.1-r1-ls153
        # ADD THESE TWO LINES:
        command: ["syslog-ng", "-F", "-f", "/config/syslog-ng.conf"]
        args: [] # Add an empty args array if you don't have other arguments
        ports:
        - containerPort: 1514
          name: syslog-udp
          protocol: UDP
        volumeMounts:
        - name: syslog-ng-writable-config
          mountPath: /config
        - name: localtime-volume
          mountPath: /etc/localtime
          readOnly: true
        - name: syslog-log-volume
          mountPath: /var/log
      volumes:
      - name: syslog-ng-config-source
        configMap:
          name: syslog-ng-config
      - name: syslog-ng-writable-config
        emptyDir: {}
      - name: localtime-volume
        hostPath:
          path: /etc/localtime
          type: FileOrCreate
      - name: syslog-log-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tel-syslog
  namespace: nok-bng
  labels:
    app: syslog-ng
spec:
  selector:
    app: syslog-ng
  ports:
  - protocol: UDP # Specify UDP protocol for the service
    port: 1514
    targetPort: syslog-udp
    name: syslog-udp
  type: LoadBalancer
  loadBalancerIP: 172.18.0.101
