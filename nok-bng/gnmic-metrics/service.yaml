kind: Service
metadata:
  name: gnmic-metrics-svc
  labels:
    app: gnmic-metrics
  namespace: nok-bng
spec:
  ports:
  - name: http
    port: 9804
    protocol: TCP
    targetPort: 9804
  selector:
    app: gnmic-metrics
  type: ClusterIP
