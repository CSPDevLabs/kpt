apiVersion: v1
kind: ConfigMap
metadata:
  name: sros-bngt-bngblaster-files
  namespace: nok-bng
data:
  configs-bngblaster-pppoe.json: "{\n    \"interfaces\": {\n        \"network\": {\n            \"interface\": \"eth2\",\n            \"address\": \"111.11.0.1/31\",\n            \"gateway\": \"111.11.0.0\",\n            \"address-ipv6\": \"2001:111:11::2/64\",\n            \"gateway-ipv6\": \"2001:111:11::1\"\n        },\n        \"access\": [\n            {\n                \"__comment__\": \"PPPoE Client\",\n                \"interface\": \"eth1\",\n                \"type\": \"pppoe\",\n                \"vlan-mode\": \"N:1\",\n\t              \"outer-vlan-min\": 101,\n               \"outer-vlan-max\": 101,\n                \"inner-vlan-min\": 0,\n\t              \"inner-vlan-max\": 0,\n                \"authentication-protocol\": \"CHAP\",\n                \"stream-group-id\": 1\n            }\n        ]\n    },\n    \"sessions\": {\n        \"count\": 10,\n\n        \"max-outstanding\": 10,\n        \"start-rate\": 5,\n        \"stop-rate\": 5\n    },  \n    \"pppoe\": {\n        \"reconnect\": true,\n        \"discovery-timeout\": 3,\n        \"discovery-retry\": 10\n    },\n    \"ppp\": {\n        \"mru\": 1492,\n        \"authentication\": {\n            \"username\": \"user{session-global}@nokia.com\",\n            \"password\": \"test\",\n            \"timeout\": 5,\n            \"retry\": 30\n        },\n        \"lcp\": {\n            \"conf-request-timeout\": 1,\n            \"conf-request-retry\": 10,\n            \"keepalive-interval\": 30,\n            \"keepalive-retry\": 3\n        },\n        \"ipcp\": {\n            \"enable\": true,\n            \"request-ip\": true,\n            \"request-dns1\": true,\n            \"request-dns2\": true,\n            \"conf-request-timeout\": 1,\n            \"conf-request-retry\": 10\n        },\n        \"ip6cp\": {\n            \"enable\": true,\n            \"conf-request-timeout\": 1,\n            \"conf-request-retry\": 10\n        }\n    },\n    \"dhcpv6\": {\n        \"enable\": true,        \n        \"ia-pd\": true,\n        \"ia-na\": true\n    },\n    \"access-line\": {\n        \"agent-remote-id\": \"RemoteID.{session-global}\",\n        \"agent-circuit-id\": \"1/1/1-OLT-NOKIA-1\"\n\n    },\n    \"session-traffic\": {\n        \"ipv4-pps\": 1,\n        \"ipv6-pps\": 1,\n        \"ipv6pd-pps\": 1\n    }, \n\n    \"streams\": [\n        {\n            \"name\": \"BestEffort\",\n            \"stream-group-id\": 1,\n            \"type\": \"ipv4\",\n            \"direction\": \"both\",\n            \"pps\": 20\n        }\n    ]\n}"
