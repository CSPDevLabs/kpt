apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: nok-bng
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-nok-bng
rules:
  # REQUIRED by kube-state-metrics to discover CRDs
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list","watch"]

  # REQUIRED to read ONLY SDCIO deviations
  - apiGroups: ["config.sdcio.dev"]
    resources: ["deviations"]
    verbs: ["list","watch"]
---  
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-nok-bng
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-nok-bng
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: nok-bng
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-crd
  namespace: nok-bng
data:
  crd-metrics.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: config.sdcio.dev
            kind: Deviation
            version: v1alpha1
          metrics:
            - name: sdcio_deviation_status
              help: "Status of sdcio deviations"
              each:
                type: Gauge
                gauge:
                  value: 1
                  labelsFromPath:
                    name: [metadata, name]
                    namespace: [metadata, namespace]

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: nok-bng
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
          args:
            - --custom-resource-state-config-file=/etc/kube-state-metrics/crd-metrics.yaml
            - --resources=deviations.config.sdcio.dev
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: crd-config
              mountPath: /etc/kube-state-metrics
              readOnly: true
      volumes:
        - name: crd-config
          configMap:
            name: kube-state-metrics-crd