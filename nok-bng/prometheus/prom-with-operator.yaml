apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: nok-bng # Or your desired namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: nok-bng # Or your desired namespace
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: nok-bng
  namespace: nok-bng
spec:
  replicas: 1
  serviceAccountName: prometheus
  serviceMonitorSelector: {} 
  podMonitorSelector: {} 
  podMetadata:
    annotations:
      netopskube.io/bbm: "true"
      netopskube.io/prober: "http"
      netopskube.io/scheme: "http"
      netopskube.io/path: "/-/ready"
  resources:
    requests:
      memory: 400Mi
  externalUrl: /prometheus
  routePrefix: /
