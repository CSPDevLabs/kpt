apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: nok-bng # Or your desired namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: nok-bng # Or your desired namespace
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: nok-bng # Or your desired namespace
data:
  prometheus.yml: |-
    global:
      scrape_interval:     5s
      evaluation_interval: 10s

    rule_files:
      - \"/etc/prometheus/rules/*\"

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - tel-am:9093

    scrape_configs:
      - job_name: smokeping
        static_configs:
          - targets: ['tel-sping:9374']
        metric_relabel_configs:
          - source_labels: [host]
            regex: '(.*)\.service\.consul'
            target_label: host
            replacement: '$1'             

      # - job_name: sros_bngt_gnmic
      #   static_configs:
      #     - targets: ['gnmic-bng-metrics-prom-bng-ext-tel-prom-output:9804','gnmic-bng-metrics-prom-bng-tel-prom-output:9804']
      #   metrics_path: /metrics
      #   metric_relabel_configs:
      #     - source_labels: [source]
      #       regex: '(.*)\.service\.consul'
      #       target_label: source
      #       replacement: '$1'    
        
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: nok-bng # Or your desired namespace
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0 # kpt-set: prom/prometheus:${prometheus-version}
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/etc/prometheus/console_libraries
        - --web.console.templates=/etc/prometheus/consoles
        # - --web.external-url=http://test.nok.local:8080/prometheus # kpt-set: --web.external-url=http://${ingress-host}:8080/prometheus
        # - --web.route-prefix=/prometheus     
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {} # For local testing, use emptyDir. For production, use PersistentVolumeClaim.
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: nok-bng # Or your desired namespace
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  type: ClusterIP # Or ClusterIP if you prefer internal access
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
