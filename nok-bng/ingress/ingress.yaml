apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nok-apps-ingress
  namespace: nok-bng
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2 # Rewrites the URL path for the backend service
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: bng.nok.local # kpt-set: ${ingress-host}
    http:
      paths:     
#      - path: /prometheus(/|$)(.*)
      - path: /prometheus(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: prometheus-operated
            port:
              number: 9090
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-svc
            port:
              number: 3000
      # - path: /gnmic-metrics(/|$)(.*)
      #   pathType: ImplementationSpecific
      #   backend:
      #     service:
      #       name: gnmic-metrics-svc
      #       port:
      #         number: 9804
      - path: /gnmic-state(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: gnmic-state-svc
            port:
              number: 9804              
      - path: /alertmanager(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: tel-am
            port:
              number: 9093             