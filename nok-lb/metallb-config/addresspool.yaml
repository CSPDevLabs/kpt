apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: nok-lb-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.19.0.100-172.19.0.120
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: production-advertisement-2
  namespace: metallb-system
spec:
  ipAddressPools:
  - nok-lb-pool
