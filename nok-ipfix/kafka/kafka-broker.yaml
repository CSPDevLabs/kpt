apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-headless
  namespace: nok-ipfix
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: nok-ipfix
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: nok-ipfix
spec:
  serviceName: kafka-broker-headless
  replicas: 1
  ordinals:
    start: 100
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
        - name: kafka-storage-format
          image: apache/kafka:4.1.0
          command:
            - /bin/bash
            - -ec
          args:
            - |
              cp /templates/broker.properties /generated/server.properties
              sed -i "s/__NODE_ID__/${POD_INDEX}/g" /generated/server.properties

              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                echo "Formatting broker storage"
                /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id "${KAFKA_CLUSTER_ID}" \
                  --no-initial-controllers \
                  --config /generated/server.properties
              else
                echo "Existing Kafka broker storage detected; skipping format"
              fi
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: KAFKA_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: CLUSTER_ID
          volumeMounts:
            - name: kafka-config-template
              mountPath: /templates
            - name: generated-config
              mountPath: /generated
            - name: kafka-data
              mountPath: /var/lib/kafka/data

      containers:
        - name: kafka-broker
          image: apache/kafka:4.1.0
          command:
            - /bin/bash
            - -ec
          args:
            - |
              exec /opt/kafka/bin/kafka-server-start.sh /generated/server.properties
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
          volumeMounts:
            - name: generated-config
              mountPath: /generated
            - name: kafka-data
              mountPath: /var/lib/kafka/data

      volumes:
        - name: kafka-config-template
          configMap:
            name: kafka-config
            items:
              - key: broker.properties
                path: broker.properties
        - name: generated-config
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
