apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: nok-ipfix
data:
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  controller.properties: |
    process.roles=controller
    node.id=__NODE_ID__

    controller.quorum.bootstrap.servers=kafka-controller-1.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093,kafka-controller-2.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093,kafka-controller-3.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093

    listeners=CONTROLLER://:9093
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT

    log.dirs=/var/lib/kafka/data

  broker.properties: |
    process.roles=broker
    node.id=__NODE_ID__

    controller.quorum.bootstrap.servers=kafka-controller-1.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093,kafka-controller-2.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093,kafka-controller-3.kafka-controller-headless.nok-ipfix.svc.cluster.local:9093

    listeners=PLAINTEXT://:9092
    advertised.listeners=PLAINTEXT://kafka-broker-__NODE_ID__.kafka-broker-headless.nok-ipfix.svc.cluster.local:9092

    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

    log.dirs=/var/lib/kafka/data

    auto.create.topics.enable=false
    num.partitions=3

    log.retention.hours=168
    log.segment.bytes=1073741824

    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    min.insync.replicas=1

    group.initial.rebalance.delay.ms=0
