apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-config-updater-sa
  namespace: nok-base
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-config-updater-role
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"] # To get the IP of consul-svc
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"] # To get and apply the coredns ConfigMap
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"] # To restart the coredns deployment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-config-updater-binding
subjects:
- kind: ServiceAccount
  name: coredns-config-updater-sa
  namespace: nok-base
roleRef:
  kind: ClusterRole
  name: coredns-config-updater-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: update-coredns-consul-ip
  namespace: nok-base
spec:
  template:
    spec:
      serviceAccountName: coredns-config-updater-sa
      restartPolicy: OnFailure
      containers:
      - name: update-coredns
        image: bitnami/kubectl:latest # Ensure this image includes 'yq'
        command: ["/bin/bash", "-c"]
        args:
        - "set -euo pipefail\n\necho \"Starting CoreDNS ConfigMap update job...\"\n\n# 1. Get the IP address of consul-svc in the nok-base namespace\nCONSUL_IP=$(kubectl get svc consul-svc -n nok-base -o jsonpath='{.spec.clusterIP}')\n\nif [ -z \"$CONSUL_IP\" ]; then\n  echo \"Error: Could not retrieve IP for consul-svc in nok-base namespace. Exiting.\"\n  exit 1\nfi\n\necho \"Found consul-svc IP: $CONSUL_IP\"\n\n# 2. Get the current coredns ConfigMap, remove problematic metadata, and store it\necho \"Fetching current coredns ConfigMap...\"\nORIGINAL_CONFIGMAP_YAML=$(kubectl get configmap coredns -n kube-system -o yaml | \\\n  yq eval 'del(.metadata.creationTimestamp, .metadata.resourceVersion, .metadata.uid, .metadata.annotations.\"kubectl.kubernetes.io/last-applied-configuration\", .metadata.managedFields)' -)\n\nif [ -z \"$ORIGINAL_CONFIGMAP_YAML\" ]; then\n  echo \"Error: Could not retrieve coredns ConfigMap. Exiting.\"\n  exit 1\nfi\necho \"Original ConfigMap fetched and cleaned.\"\n\n# 3. Extract the Corefile content\nCOREFILE_CONTENT=$(echo \"$ORIGINAL_CONFIGMAP_YAML\" | yq eval '.data.Corefile' -)\nMODIFIED_COREFILE_CONTENT=\"\"\n\n# 4. Check if the consul block exists and perform conditional update\nif echo \"$COREFILE_CONTENT\" | grep -q \"consul:53 {\"; then\n  echo \"Consul block found in Corefile. Performing IP substitution.\"\n  MODIFIED_COREFILE_CONTENT=$(echo \"$COREFILE_CONTENT\" | sed \"s/consul-svc:8600/${CONSUL_IP}:8600/g\")\nelse\n  echo \"Consul block not found in Corefile. Appending new block.\"\n  CONSUL_BLOCK_TO_ADD=\"\n# block to forward .consul queries to your Consul service\nconsul:53 {\n    forward . ${CONSUL_IP}:8600\n}\"\n  MODIFIED_COREFILE_CONTENT=\"${COREFILE_CONTENT}${CONSUL_BLOCK_TO_ADD}\"\nfi\n\necho \"MODIFIED_COREFILE_CONTENT =\n--- \n${MODIFIED_COREFILE_CONTENT}\n---\n\"\n\n# 4. Create a temporary patch file with the modified Corefile content\nPATCH_FILE=\"/tmp/coredns-patch.yaml\"\ncat <<EOF > \"$PATCH_FILE\"\ndata:\n  Corefile: |\n$(echo \"$MODIFIED_COREFILE_CONTENT\" | sed 's/^/    /')\nEOF\n# The 'sed' command adds 4 spaces indentation to each line of MODIFIED_COREFILE_CONTENT\n# to ensure it's correctly parsed as a literal block under 'Corefile: |'\n\necho \"Applying modified CoreDNS ConfigMap using patch file...\"\n\necho \"PATCH_FILE=\"\necho \"---\"\ncat $PATCH_FILE\necho \"---\"\n\nkubectl patch configmap coredns -n kube-system --patch-file \"$PATCH_FILE\"\n\nif [ $? -ne 0 ]; then\n  echo \"Error: Failed to apply CoreDNS ConfigMap. Exiting.\"\n  exit 1\nfi\n\necho \"CoreDNS ConfigMap 'coredns' updated successfully in kube-system namespace.\"\n\n# 5. Restart the coredns deployment to pick up the ConfigMap changes\necho \"Restarting coredns deployment in kube-system namespace...\"\nkubectl rollout restart deployment coredns -n kube-system\n\nif [ $? -ne 0 ]; then\n  echo \"Error: Failed to restart coredns deployment. Exiting.\"\n  exit 1\nfi\n\necho \"coredns deployment restarted successfully.\"\necho \"Job completed.\""
