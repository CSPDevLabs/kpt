---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-config-updater-sa
  namespace: nok-base
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-config-updater-role
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"] # To get the IP of consul-svc
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"] # To get and apply the coredns ConfigMap
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"] # To restart the coredns deployment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-config-updater-binding
subjects:
- kind: ServiceAccount
  name: coredns-config-updater-sa
  namespace: nok-base
roleRef:
  kind: ClusterRole
  name: coredns-config-updater-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: update-coredns-consul-ip
  namespace: nok-base
spec:
  template:
    spec:
      serviceAccountName: coredns-config-updater-sa
      restartPolicy: OnFailure
      containers:
      - name: update-coredns
        image: bitnami/kubectl:latest # Ensure this image includes 'yq'
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail

            echo "Starting CoreDNS ConfigMap update job..."

            # 1. Get the IP address of consul-svc in the nok-base namespace
            CONSUL_IP=$(kubectl get svc consul-svc -n nok-base -o jsonpath='{.spec.clusterIP}')

            if [ -z "$CONSUL_IP" ]; then
              echo "Error: Could not retrieve IP for consul-svc in nok-base namespace. Exiting."
              exit 1
            fi

            echo "Found consul-svc IP: $CONSUL_IP"

            # 2. Get the current coredns ConfigMap, remove problematic metadata, and store it
            echo "Fetching current coredns ConfigMap..."
            ORIGINAL_CONFIGMAP_YAML=$(kubectl get configmap coredns -n kube-system -o yaml | \
              yq eval 'del(.metadata.creationTimestamp, .metadata.resourceVersion, .metadata.uid, .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration", .metadata.managedFields)' -)

            if [ -z "$ORIGINAL_CONFIGMAP_YAML" ]; then
              echo "Error: Could not retrieve coredns ConfigMap. Exiting."
              exit 1
            fi
            echo "Original ConfigMap fetched and cleaned."

            # 3. Extract the Corefile content
            COREFILE_CONTENT=$(echo "$ORIGINAL_CONFIGMAP_YAML" | yq eval '.data.Corefile' -)
            MODIFIED_COREFILE_CONTENT=""

            # 4. Check if the consul block exists and perform conditional update
            if echo "$COREFILE_CONTENT" | grep -q "consul:53 {"; then
              echo "Consul block found in Corefile. Performing IP substitution."
              MODIFIED_COREFILE_CONTENT=$(echo "$COREFILE_CONTENT" | sed "s/consul-svc:8600/${CONSUL_IP}:8600/g")
            else
              echo "Consul block not found in Corefile. Appending new block."
              CONSUL_BLOCK_TO_ADD="
            # block to forward .consul queries to your Consul service
            consul:53 {
                forward . ${CONSUL_IP}:8600
            }"
              MODIFIED_COREFILE_CONTENT="${COREFILE_CONTENT}${CONSUL_BLOCK_TO_ADD}"
            fi

            echo "MODIFIED_COREFILE_CONTENT =
            --- 
            ${MODIFIED_COREFILE_CONTENT}
            ---
            "

            # 4. Create a temporary patch file with the modified Corefile content
            PATCH_FILE="/tmp/coredns-patch.yaml"
            cat <<EOF > "$PATCH_FILE"
            data:
              Corefile: |
            $(echo "$MODIFIED_COREFILE_CONTENT" | sed 's/^/    /')
            EOF
            # The 'sed' command adds 4 spaces indentation to each line of MODIFIED_COREFILE_CONTENT
            # to ensure it's correctly parsed as a literal block under 'Corefile: |'

            echo "Applying modified CoreDNS ConfigMap using patch file..."

            echo "PATCH_FILE="
            echo "---"
            cat $PATCH_FILE
            echo "---"

            kubectl patch configmap coredns -n kube-system --patch-file "$PATCH_FILE"

            if [ $? -ne 0 ]; then
              echo "Error: Failed to apply CoreDNS ConfigMap. Exiting."
              exit 1
            fi

            echo "CoreDNS ConfigMap 'coredns' updated successfully in kube-system namespace."

            # 5. Restart the coredns deployment to pick up the ConfigMap changes
            echo "Restarting coredns deployment in kube-system namespace..."
            kubectl rollout restart deployment coredns -n kube-system

            if [ $? -ne 0 ]; then
              echo "Error: Failed to restart coredns deployment. Exiting."
              exit 1
            fi

            echo "coredns deployment restarted successfully."
            echo "Job completed."