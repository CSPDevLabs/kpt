<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NetOpsKube Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main-layout">
  <div id="sidebar" class="sidebar expanded">
      <div class="sidebar-header">
        <div id="menu-toggle" class="hamburger">☰</div>
        <span id="domain-badge" class="domain-badge" style="display:none;"></span>
      </div>
      <div id="home-nav" class="nav-item active" data-page="home" data-tooltip="Home">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">
              Home
          </span>
      </div>
      <div id="dynamic-nav"></div>
  </div>
  <div class="content">
    
    <div id="topbar" class="topbar">
        <div class="portal-title">NetOpsKube Portal</div>
        <div id="topbar-right" style="margin-left:auto; display:flex; align-items:center; gap:15px;">
          <span class="version">v1.0</span>
          <div id="account-btn" class="account-circle">
            <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
              <path d="M12 12c2.7 0 4.8-2.2 4.8-4.8S14.7 2.4 12 2.4 7.2 4.6 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V22h19.2v-2.8c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
        </div>
    </div>
    <div class="app-container">
      <div id="welcome-screen">
        <div class="home-dashboard">
            <div class="global-services"></div>
    
            <div class="solution-panel">
                <h2 class="solution-title">
                    Select Domain
                </h2>
                <select id="solution-select" class="solution-dropdown">
                    <option value="">Choose Domain...</option>
                </select>
                <div id="solution-apps" class="solution-apps"></div>
            
            </div>
            </div>
    
        </div>
      
      </div>
  
      <div id="loading-overlay" class="loading-overlay" style="display:none;">
          <div class="loader"></div>
          <div class="loading-text">Loading...</div>
      </div>
      <iframe id="app-frame" style="display:none;"></iframe>
    
    </div>
    
  </div>
</div>
<div id="account-panel" class="account-panel">
  <div class="user-avatar" id="user-avatar"></div>
  <button id="logout-btn" class="logout-btn">
    Logout
  </button>
</div>
<script src="icons.js"></script>
<script>
function renderIcon(name, className) {
  const html = appIcons[name];
  if (!html) return "⚙️";
  return className ? html.replace("sidebar-icon", className) : html;
}

function isDeployed(item) {
  return (item.deployed || "").toLowerCase() === "yes";
}

function isKeycloakEnabled(featured) {
  const keycloak = (featured || []).find(item => item.name === "Keycloak");
  return keycloak && isDeployed(keycloak);
}

document.addEventListener('DOMContentLoaded', () => {
  const appFrame = document.getElementById('app-frame');
  const loadingOverlay = document.getElementById("loading-overlay");
  appFrame.onload = () => {
      loadingOverlay.style.display = "none";
  };

  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      appFrame.src = "about:blank";
      window.top.location.href = "/oauth2/sign_out?rd=/oauth2/start?rd=%2F";
    });
  }
  const accountBtn = document.getElementById('account-btn');
  const accountPanel = document.getElementById('account-panel');
  
  const sidebar=document.getElementById("sidebar");
  const menuToggle=document.getElementById("menu-toggle");
  const domainBadge=document.getElementById("domain-badge");
  menuToggle.onclick=()=>{
    sidebar.classList.toggle("collapsed");
  };
  if (accountBtn) {
    accountBtn.addEventListener('click', () => {
      accountPanel.classList.toggle('active');
    });
  }
  document.addEventListener('click', (e) => {
    const isAccountClick = accountPanel.contains(e.target) || accountBtn.contains(e.target);
    if (!isAccountClick) {
      accountPanel.classList.remove('active');
    }
  });
  fetch('/menu-config.json')
    .then(resp => resp.ok ? resp.json() : Promise.reject(resp.status))
    .then(menuItems => {
      if (isKeycloakEnabled(menuItems.featured)) {
        document.body.classList.add('keycloak-enabled');
        const userAvatar = document.getElementById('user-avatar');
        if (userAvatar && typeof userAvatarIcon !== 'undefined') {
          userAvatar.innerHTML = userAvatarIcon;
        }
      }

      const globalApps = {};
      const dynamicNav=document.getElementById("dynamic-nav");
      const welcomeScreen = document.getElementById("welcome-screen");
      const solutionSelect=document.getElementById("solution-select");
      const solutionApps=document.getElementById("solution-apps");
      const solutions = {};
      let currentSolution = null;
      menuItems.solutions.forEach(solution => {
          if ((solution.deployed || "").toLowerCase() !== "yes") {
              return;
          }
          solutions[solution.id] = solution;
          const option = document.createElement("option");
          option.value = solution.id;
          option.textContent = solution.displayName;
          solutionSelect.appendChild(option);
      });
      function updateDomainBadge(solution){
          if(solution){
              domainBadge.textContent = solution.displayName;
              domainBadge.style.display = "inline-flex";
          }
          else{
              domainBadge.textContent = "";
              domainBadge.style.display = "none";
          }
      }
      
      function buildSidebar(solution){
          dynamicNav.innerHTML="";
          const allApps=[];
          menuItems.featured
          .filter(isDeployed)
          .forEach(app => {
              allApps.push(app);
          });
          if(solution){
              solution.services.forEach(app=>{
                  allApps.push(app);
              });
          }
          allApps.forEach(app=>{
              const item=document.createElement("div");
              item.className="nav-item";
              item.setAttribute("data-tooltip", app.name);
              item.innerHTML=`
                  <span class="nav-icon">
                      ${renderIcon(app.name)}
                  </span>
                  <span class="nav-text">
                      ${app.name}
                  </span>
              `;
              item.onclick=()=>{
                  document.querySelectorAll(".nav-item")
                      .forEach(n=>n.classList.remove("active"));
                  item.classList.add("active");
                  if(app.openInNewTab){
                      window.open(app.path,"_blank");
                      return;
                  }
                  document.getElementById("topbar").classList.add("hidden");
                  welcomeScreen.style.display="none";
                  loadingOverlay.style.display = "flex";
                  appFrame.style.display="block";
                  appFrame.src=app.path;
              };
              dynamicNav.appendChild(item);
          });
      }          
      
      
      document.getElementById("home-nav").onclick = () => {
          currentSolution = null;
          updateDomainBadge(null);
          document.getElementById("topbar").classList.remove("hidden");
          dynamicNav.innerHTML = "";
          solutionSelect.value = "";
          solutionApps.innerHTML = "";
          document.querySelectorAll(".nav-item")
              .forEach(n => n.classList.remove("active"));
          document.getElementById("home-nav")
              .classList.add("active");
          appFrame.src = "about:blank";
          appFrame.style.display = "none";
          welcomeScreen.style.display = "flex";
      };
      
      solutionSelect.onchange=()=>{
          solutionApps.innerHTML="";
          currentSolution = solutionSelect.value ? solutions[solutionSelect.value] : null;
          const solution = currentSolution;
          updateDomainBadge(solution);
          if(!solutionSelect.value){
            solutionApps.innerHTML="";
            return;
          }
          solution.services.forEach((app,index)=>{
              const card=document.createElement("div");
              card.className="app-card";
              card.innerHTML = `
                  <div class="app-icon">
                      ${renderIcon(app.name, "app-icon-img")}
                  </div>
                  <div class="app-name">${app.name}</div>
              `;
              card.onclick=()=>{
                  if(app.openInNewTab){
                      window.open(app.path,"_blank");
                  }else{
                      buildSidebar(solutionSelect.value ? solutions[solutionSelect.value] : null);
                      document.getElementById("topbar").classList.add("hidden");
                      welcomeScreen.style.display="none";
                      loadingOverlay.style.display = "flex";
                      appFrame.style.display="block";
                      appFrame.src=app.path;
                  }
              };
              solutionApps.appendChild(card);
              setTimeout(()=>{
                  card.classList.add("show");
              },120*index);
          });  
      };
      
      function openGlobalApp(app) {
          if (app.openInNewTab) {
              window.open(app.path, "_blank");
          } else {
              buildSidebar(currentSolution);
              document.getElementById("topbar").classList.add("hidden");
              document.getElementById("welcome-screen").style.display = "none";
              loadingOverlay.style.display = "flex";
              appFrame.style.display = "block";
              appFrame.src = app.path;
          }
      }

      function renderGlobalServices() {
          const container = document.querySelector(".global-services");
          container.innerHTML = "";
          menuItems.featured
              .filter(isDeployed)
              .forEach(app => {
                  globalApps[app.name] = app;
                  const card = document.createElement("div");
                  card.className = "service-card";
                  card.dataset.name = app.name;
                  card.innerHTML = `
                      <div class="service-icon">${renderIcon(app.name, "service-icon-img")}</div>
                      <div class="service-title">${app.name}</div>
                      <div class="service-desc">${app.description || ""}</div>
                  `;
                  card.onclick = () => openGlobalApp(app);
                  container.appendChild(card);
              });
      }

      renderGlobalServices();
    })
    .catch(err => {
      alert("Failed to load menu configuration");
    });
});
</script>
</body>
</html>
