apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nok-apps-portal-ingress
  namespace: nok-dia
spec:
  ingressClassName: nginx
  rules:
  - host: bng.nok.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nok-apps-portal-service
            port:
              number: 80
