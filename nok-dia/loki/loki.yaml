apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: nok-dia
  labels:
    app: loki
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 0.0.0.0
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    frontend:
      encoding: protobuf

    ruler:
      alertmanager_url: http://tel-am:9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: nok-dia
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.4.2
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
          name: loki-3100
        - containerPort: 9096
          name: loki-9096
        volumeMounts:
        - name: loki-config-volume
          mountPath: /etc/loki/local-config.yaml
          subPath: loki.yml
        - name: loki-data-volume
          mountPath: /loki
      volumes:
      - name: loki-config-volume
        configMap:
          name: loki-config
      - name: loki-data-volume
        hostPath: # Using hostPath as requested for /tmp/lokidata
          path: /tmp/lokidata
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tel-loki
  namespace: nok-dia
  labels:
    app: loki
  annotations:
    netopskube.io/bbm: "true"
    netopskube.io/prober: tcp
spec:
  selector:
    app: loki
  ports:
  - protocol: TCP
    port: 3100
    targetPort: 3100
    name: loki-3100
  - protocol: TCP
    port: 9096
    targetPort: 9096
    name: loki-9096
  type: ClusterIP
